name: Daily news
on:
  schedule:
    - cron: "7,27,47 5-9 * * *"
  workflow_dispatch:
    inputs:
      which:
        description: "gr or nl (blank = auto)"
        required: false
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python send_news.py ${{ github.event.inputs.which }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save sent state
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add sent.json
            git commit -m "Update sent state"
            git push
          fi
